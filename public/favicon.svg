<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <title>bynarixatech</title>
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#FF2BD6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Container -->
  <rect width="512" height="512" rx="100" fill="#070A0F" />
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="url(#brandGrad)" stroke-width="8" stroke-opacity="0.4" />
  
  <!-- Terminal Icon Graphics -->
  <path d="M120 180 L200 240 L120 300" fill="none" stroke="url(#brandGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <line x1="220" y1="300" x2="300" y2="300" stroke="#00E5FF" stroke-width="28" stroke-linecap="round" filter="url(#glow)" />

  <!-- BYNARIXATECH Text Badge -->
  <text x="256" y="420" text-anchor="middle" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="42" letter-spacing="3">BYNARIXATECH</text>
</svg>
